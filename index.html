<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    .hero {
      position: relative;
      background-image: url('https://res.cloudinary.com/dqasmnsve/image/upload/v1753192169/abstract-textured-backgound_1_ixdk3k.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.5); /* Dark overlay */
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      font-weight: 500;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .hero form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .hero input[type="email"] {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      width: 250px;
      max-width: 90%;
    }
.hero button {
  background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
  color: #000;
  border: none;
  border-radius: 30px;
  padding: 12px 26px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
}

.hero button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
}


    .hero .social-icons {
      display: flex;
      gap: 20px;
      font-size: 24px;
    }

    .hero .social-icons a {
      color: white;
      text-decoration: none;
    }

  </style>
</head>
<body>

  <!-- ✅ Hero Section -->
  <div class="hero">
    <div class="hero-content">
      <h1>Minecraft Coming Soon</h1>
      <p>Be the first to know when Minecraft launches. Sign up now and stay updated!</p>

      <!-- ✅ Email Input -->
      <form onsubmit="event.preventDefault();">
        <input type="email" placeholder="Enter your email" required>
        <button type="submit">Notify Me</button>
      </form>

      <!-- ✅ Social Media Icons -->
      <div class="social-icons">
        <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank"><i class="fab fa-x-twitter"></i></a>
        <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </div>

</body>
</html>
