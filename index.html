<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mindcraft Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
      overflow: hidden;
    }

    .hero {
      position: relative;
      background-image: url('https://res.cloudinary.com/dqasmnsve/image/upload/v1753192169/abstract-textured-backgound_1_ixdk3k.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 650px;
      width: 100%;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 30px;
      width: 120px;
      z-index: 3;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      font-weight: 500;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .hero form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .hero input[type="email"] {
      padding: 12px 16px;
      border: 1px solid #ccc;
       border-radius: 25px !important;
      font-size: 14px;
      width: 250px;
      max-width: 90%;
      background-color: #fff;
      color: #000;
      transition: border 0.3s ease, box-shadow 0.3s ease;
    }

    .hero input[type="email"]:focus {
      border-color: #38f9d7;
      box-shadow: 0 0 0 3px rgba(56, 249, 215, 0.3);
      outline: none;
      border-radius: 25px !important;
    }

    .hero button {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 12px 26px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .hero button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    .hero .social-icons {
      display: flex;
      gap: 20px;
      font-size: 24px;
    }

    .hero .social-icons a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- ✅ Hero Section -->
  <div class="hero">
    <!-- Top-left Logo -->
    <img src="https://res.cloudinary.com/dqasmnsve/image/upload/v1753193023/MIND_CRAFT_1_mj8wmj.png" alt="Company Logo" class="logo" />

    <!-- Centered Content -->
    <div class="hero-content">
      <h1>Mindcraft Coming Soon</h1>
      <p>Be the first to know when Mindcraft launches. Sign up now and stay updated!</p>

      <form onsubmit="event.preventDefault();">
        <input type="email" placeholder="Enter your email" required>
        <button type="submit">Notify Me</button>
      </form>
      <div id="message" style="margin-top: 20px; font-size: 16px; font-weight: 600; color: #38f9d7; display: none;">
  🎉 Thank you! You'll be notified when we launch.
</div>

      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </div>
  <script>
  const form = document.querySelector('form');
  const message = document.getElementById('message');

  form.addEventListener('submit', function () {
    message.style.display = 'block';
  });
</script>

</body>
</html>
